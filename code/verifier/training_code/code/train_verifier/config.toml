"project name" = "ORM verifier training"
version = "1.0.0"

[configuration]
train_data = "data/train_verifier_qa/train.csv"
val_data = "data/train_verifier_qa/val.csv"
base_model = "meta-llama/Llama-3.2-3B"
is_base_encoder = false
use_lora = true
lora_rank = 8
lora_alpha = 16
max_length = 1024
batch_size = 12
patience = 2
lr = 1e-4
num_epochs = 10
output_dir = "llama3B-lora-finqa"